<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Constructor de Cursos para Blogger</title>
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<style>
body{font-family:Segoe UI,sans-serif;background:#f4f6f9;margin:0;padding:20px}
.container{max-width:1200px;margin:auto}
.card{background:#fff;padding:20px;border-radius:12px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
input,textarea,select{width:100%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:8px}
button{padding:10px 15px;border:none;border-radius:8px;cursor:pointer;margin:5px}
.primary{background:#2563eb;color:#fff}
.block{border:2px dashed #ccc;padding:15px;margin-top:15px;border-radius:10px}
#preview{background:#fff;padding:20px;border-radius:12px;min-height:200px}
#output{width:100%;height:250px}
</style>
</head>
<body>
<div class="container">
<div class="card">
<h1>Constructor de Cursos para Blogger</h1>
<input id="courseTitle" placeholder="Título del curso">
<input id="courseSubtitle" placeholder="Subtítulo">
<input id="instructor" placeholder="Instructor">
</div>

<div class="card">
<button class="primary" onclick="addBlock('Introducción')">+ Introducción</button>
<button class="primary" onclick="addBlock('Módulo')">+ Módulo</button>
<button class="primary" onclick="addBlock('Recurso Extra')">+ Recurso Extra</button>
<button class="primary" onclick="addBlock('Evaluación Final')">+ Evaluación Final</button>
<div id="blocks"></div>
</div>

<div class="card">
<h2>Vista previa</h2>
<div id="preview"></div>
</div>

<div class="card">
<button class="primary" onclick="generateCode()">Generar Código Blogger</button>
<button onclick="copyCode()">Copiar Código</button>
<textarea id="output"></textarea>
</div>
</div>

<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
<script>
let count=0;

function addBlock(type){
 const div=document.createElement('div');
 div.className='block';
 div.innerHTML=`
 <h3>${type}</h3>
 <input class="title" placeholder="Título">
 <input class="image" placeholder="URL Imagen portada">
 <div id="editor${count}" style="height:150px"></div>
 <input class="video" placeholder="URL Video">
 <input class="pdf" placeholder="URL PDF">
 `;
 document.getElementById('blocks').appendChild(div);

 let q=new Quill('#editor'+count,{
 theme:'snow',
 modules:{toolbar:[
 [{'header':[1,2,3,false]}],
 ['bold','italic','underline'],
 [{'list':'ordered'},{'list':'bullet'}],
 ['link','image']
 ]}
 });

 div.quill=q;
 count++;
 q.on('text-change',updatePreview);
 div.querySelectorAll('input').forEach(x=>x.addEventListener('input',updatePreview));
 updatePreview();
}

function updatePreview(){
 let html=`<h1>${courseTitle.value||'Curso'}</h1>`;
 html+=`<h3>${courseSubtitle.value||''}</h3>`;

 document.querySelectorAll('.block').forEach(b=>{
   html+=`<hr><h2>${b.querySelector('.title').value||'Sin título'}</h2>`;
   let img=b.querySelector('.image').value;
   if(img) html+=`<img src="${img}" style="max-width:100%;border-radius:10px">`;
   html+=b.quill.root.innerHTML;
 });

 document.getElementById('preview').innerHTML=html;
}

courseTitle.oninput=updatePreview;
courseSubtitle.oninput=updatePreview;

function generateCode(){
 let code=`<div class="curso-blogger">`;
 code+=`<h1>${courseTitle.value}</h1>`;
 code+=`<h3>${courseSubtitle.value}</h3>`;

 document.querySelectorAll('.block').forEach(b=>{
   code+=`<section>`;
   code+=`<h2>${b.querySelector('.title').value}</h2>`;

   let img=b.querySelector('.image').value;
   if(img) code+=`<img src="${img}" style="max-width:100%">`;

   code+=b.quill.root.innerHTML;

   let video=b.querySelector('.video').value;
   if(video) code+=`<p><a href="${video}" target="_blank">Ver Video</a></p>`;

   let pdf=b.querySelector('.pdf').value;
   if(pdf) code+=`<p><a href="${pdf}" target="_blank">Abrir PDF</a></p>`;

   code+=`</section>`;
 });

 code+=`</div>`;
 document.getElementById('output').value=code;
}

function copyCode(){
 output.select();
 document.execCommand('copy');
 alert('Código copiado');
}
</script>
</body>
</html>
